# Classic rule set: the original game's values, as RTTR plays them (fight_k is RTTR's default,
# "medium strength"; see docs/DEPARTURES.md).
# Sources: RTTR master 566e923 (libs/s25main/gameData/*.h, JobConsts.cpp, nobHQ.cpp).
# Integers only. Times are in game frames (GF, 50 ms at normal speed).

[military]
hp = [3, 4, 5, 6, 7]
fight_k = 10                    # rand(rank + K): RTTR noFighting default ("medium strength"); 6 = "maximum"
heal_every = 500                # +1 HP per 500 + rand(500) GF
heal_rand = 500
promote_wait = 100              # 100 + rand(300) GF per coin
promote_rand = 300
attack_radius = 21
attack_max_walk = 40
recruit_wait = 200
recruit_rand = 200

[economy]
flag_capacity = 8
helper_spawn = 150              # +1 helper per 150 + rand(20) GF while below max
helper_spawn_rand = 20
helper_max = 100
donkey_busy_percent = 80
donkey_window = 6000
woodcutter_radius = 6
forester_radius = 6
stonemason_radius = 8
fisher_radius = 7
hunter_radius = 19  # RTTR ANIMAL_RADIUS
farmer_radius = 2
geologist_radius = 15
geologist_flags = 15

