[package]
name = "rr-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
rr-audio.workspace = true
rr-ai.workspace = true
rr-game.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "wgpu", "default_fonts", "x11", "wayland"] }
rr-formats.workspace = true
rr-mapgen.workspace = true
rr-sim.workspace = true
rr-rules.workspace = true
rr-world.workspace = true
rr-core.workspace = true
rr-net.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# (eframe turns wgpu's default backends off, leaving Windows with Vulkan only: DirectX 12 too,
# whose software renderer WARP draws even without a graphics driver, as in many virtual machines)
[target.'cfg(windows)'.dependencies]
wgpu = { version = "24", default-features = false, features = ["dx12"] }
